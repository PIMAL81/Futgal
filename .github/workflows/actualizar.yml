name: Actualizar Top 3 Futgal

on:
  schedule:
    # Sábados y domingos cada 30 minutos (07:00-23:00 UTC)
    - cron: "*/30 7-23 * * 6,0"
    # Lunes a viernes cada 3 horas
    - cron: "0 */3 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install beautifulsoup4

      - name: Extraer Top 3 de los 11 grupos
        run: python actualizar_top3.py

      - name: Guardar cambios si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar clasificación Top 3 Futgal"
            git pull --rebase --autostash origin main
            git push || (git pull --rebase --autostash origin main && git push)
          fi
